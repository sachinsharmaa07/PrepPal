version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: preppal-postgres
    environment:
      POSTGRES_USER: preppal
      POSTGRES_PASSWORD: password
      POSTGRES_DB: preppal_db
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U preppal -d preppal_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: preppal-redis
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # We'll add Judge0 services here later when setting up the coding module

volumes:
  postgres_data:
  redis_data:
